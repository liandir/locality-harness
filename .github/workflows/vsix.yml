name: Build VSIX

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build-vsix:
    name: Build VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install browser for UI tests
        run: npx playwright install --with-deps chromium

      - name: Test webview interactions
        run: npm run test:ui

      - name: Package VSIX
        run: npm run package:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: locality-harness-vsix
          path: "artifacts/*.vsix"
          if-no-files-found: error
